name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3.0"
          opam-depext: false

      - name: Check note sources and prerequisite graph
        run: |
          node scripts/test-note-editorial.mjs
          node scripts/test-note-prerequisites.mjs
          node scripts/test-subject-navigation.mjs
          node scripts/check-note-prerequisites.mjs
          node scripts/check-note-editorial.mjs --strict-format
          node scripts/check-subject-navigation.mjs
          node scripts/check-icm-section-coverage.mjs
          node scripts/check-topic-narratives.mjs
          node scripts/check-topic-introductions.mjs
          node scripts/check-geometry-notes.mjs
          node scripts/check-bourbaki-notes.mjs
          node scripts/check-analysis-notes.mjs
          node tests/analysis-math.test.mjs
          node --test tests/topology-report-math.test.mjs tests/topology-fibring-discs-math.test.mjs
          node --test tests/topology-coverage.test.mjs
          node --test tests/plenary-coverage.test.mjs tests/plenary-math.test.mjs
          node --test tests/geometry-oct16.test.mjs
          node --test tests/geometry-closing-kakeya.test.mjs
          node --test tests/geometry-harmonic-contact.test.mjs
          node --test tests/geometry-stability-flow-kahler.test.mjs
          node --test tests/geometry-final-reports.test.mjs
          node --test tests/lie-first-reports.test.mjs
          node --test tests/lie-second-reports.test.mjs
          node --test tests/topology-exotic-stems-graphs-math.test.mjs
          node tests/bourbaki-math.test.mjs
          node tests/geometry-expansion-math.test.mjs
          node scripts/check-number-theory-notes.mjs
          node tests/number-theory-computation.test.mjs
          node tests/number-theory-computation-expansion.test.mjs
          node tests/number-theory-microlocal.test.mjs
          node scripts/check-site-notes.mjs --source-only
          node scripts/check-algebra-notes.mjs --source-only
          node scripts/check-riehl-notes.mjs

      - name: Install LaTeX (for tikz-cd diagrams)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-fonts-recommended \
            xsltproc \
            dvisvgm

      - name: Install Forester
        run: opam install forester -y

      - name: Apply reading theme and localization
        run: node scripts/apply-theme.mjs

      - name: Build forest
        run: |
          eval $(opam env)
          forester build forest.toml

      - name: Generate static HTML
        run: |
          node tests/static-html.test.mjs
          node scripts/build-static-html.mjs

      - name: Check generated pages and research manifests
        run: |
          node scripts/check-site-domain.mjs
          node scripts/check-static-html.mjs
          node scripts/check-reading-ui.mjs
          node scripts/check-site-notes.mjs
          node scripts/check-logic-notes.mjs
          node scripts/check-algebra-notes.mjs

      - name: Test without browser XSLT
        run: |
          npm install --prefix "$RUNNER_TEMP/site-browser" --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/site-browser/node_modules/.bin/playwright" install --with-deps chromium --only-shell
          python3 -m http.server 8083 --bind 127.0.0.1 --directory build/site > "$RUNNER_TEMP/site-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/site-browser/node_modules/playwright/index.mjs"
          export PREVIEW_URL="http://127.0.0.1:8083/"
          node scripts/check-reading-ui.mjs
          node tests/static-html-browser.test.mjs
          node tests/number-theory-render.test.mjs
          node tests/bourbaki-render.test.mjs
          node tests/analysis-render.test.mjs
          node tests/topology-report-render.test.mjs
          TOPOLOGY_RECORD=research/icm2026-topology-fibring-discs.json node tests/topology-report-render.test.mjs
          TOPOLOGY_RECORD=research/icm2026-topology-piccirillo.json node tests/topology-report-render.test.mjs
          TOPOLOGY_RECORD=research/icm2026-topology-schlank.json node tests/topology-report-render.test.mjs
          TOPOLOGY_RECORD=research/icm2026-topology-watanabe.json node tests/topology-report-render.test.mjs
          node tests/plenary-render.test.mjs
          TOPOLOGY_RECORD=research/icm2026-geometry-oct16.json node tests/topology-report-render.test.mjs
          TOPOLOGY_RECORD=research/icm2026-geometry-closing-kakeya.json node tests/topology-report-render.test.mjs
          TOPOLOGY_RECORD=research/icm2026-geometry-harmonic-contact.json node tests/topology-report-render.test.mjs
          TOPOLOGY_RECORD=research/icm2026-geometry-stability-flow-kahler.json node tests/topology-report-render.test.mjs
          TOPOLOGY_RECORD=research/icm2026-geometry-final-reports.json node tests/topology-report-render.test.mjs
          TOPOLOGY_RECORD=research/icm2026-lie-first-reports.json node tests/topology-report-render.test.mjs
          TOPOLOGY_RECORD=research/icm2026-lie-second-reports.json node tests/topology-report-render.test.mjs
          node tests/topic-introductions-render.test.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
