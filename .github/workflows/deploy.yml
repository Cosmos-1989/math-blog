name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3.0"
          opam-depext: false

      - name: Check note sources and prerequisite graph
        run: |
          node scripts/test-note-editorial.mjs
          node scripts/check-note-editorial.mjs --strict-format
          node scripts/check-subject-navigation.mjs
          node scripts/check-topic-narratives.mjs
          node scripts/check-number-theory-notes.mjs
          node scripts/check-site-notes.mjs --source-only
          node scripts/check-algebra-notes.mjs --source-only
          node scripts/check-riehl-notes.mjs

      - name: Install LaTeX (for tikz-cd diagrams)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-fonts-recommended \
            xsltproc \
            dvisvgm

      - name: Install Forester
        run: opam install forester -y

      - name: Apply reading theme and localization
        run: node scripts/apply-theme.mjs

      - name: Build forest
        run: |
          eval $(opam env)
          forester build forest.toml

      - name: Check generated pages and research manifests
        run: |
          node scripts/check-site-domain.mjs
          node scripts/check-reading-ui.mjs
          node scripts/check-site-notes.mjs
          node scripts/check-logic-notes.mjs
          node scripts/check-algebra-notes.mjs

      - name: Prepare for GitHub Pages
        run: |
          # The custom domain is served at its root, with no repository prefix.
          mkdir -p deploy
          cp -r output/. deploy/
          cp CNAME deploy/CNAME
          touch deploy/.nojekyll

          # Create root index.html with redirect
          cat > deploy/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
            <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0;url=./index/index.xml">
              <title>數林廣記</title>
            </head>
            <body>
              <p>前往<a href="./index/index.xml">數林廣記</a>。</p>
            </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
