name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3.0"
          opam-depext: false

      - name: Install Forester
        run: opam install forester -y

      - name: Build forest
        run: |
          eval $(opam env)
          forester build forest.toml

      - name: Fix paths for GitHub Pages
        run: |
          # Fix root index.html redirect
          echo '<!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0;url=./index/" />
            </head>
          </html>' > output/index.html

          # Fix all subdirectory index.html redirects to use relative paths
          for dir in output/*/; do
            if [ -f "${dir}index.html" ]; then
              # Extract the directory name
              dirname=$(basename "$dir")
              # Create relative redirect
              echo "<!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv=\"refresh\" content=\"0;url=./${dirname}/index.xml\" />
            </head>
          </html>" > "${dir}index.html"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
