name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3.0"
          opam-depext: false

      - name: Install Forester
        run: opam install forester -y

      - name: Build forest
        run: |
          eval $(opam env)
          forester build forest.toml

      - name: Fix paths for GitHub Pages
        run: |
          # Create a proper root index.html that redirects to index/index.xml
          cat > output/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0;url=./index/index.xml">
              <title>Math Blog</title>
            </head>
            <body>
              <p>Redirecting to <a href="./index/index.xml">Math Blog</a>...</p>
            </body>
          </html>
          EOF

          # Fix the index/index.html to use relative path
          cat > output/index/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0;url=./index.xml">
            </head>
          </html>
          EOF

          # Fix all tree directories to have proper index.html
          for dir in output/000*/ output/author/; do
            if [ -d "$dir" ]; then
              cat > "${dir}index.html" << EOF
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0;url=./index.xml">
            </head>
          </html>
          EOF
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
